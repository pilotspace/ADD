  ["add refute + tiers", "1–3 probes from the rules; fresh subagent for security · data · architecture"],
  ["add interview + human freeze", "## ASSUMPTIONS, reviewed after in the report"],
  ["add status", "read PROJECT.md + open task files; git log"],
  ["add learn / deltas / fold", "a line in ## Deltas; promote to Decisions that bind"],
  ["add milestone-done", "tick each EXIT box with its evidence"],
  ["add wave / join", "one git worktree per task, disjoint scope:"],
  ["quick-lane tripwire", "Quick work that touches the floor is a Task now"],
  ["gives: refreeze marks consumers stale", "Verify runs every consumer's tests"],
  ["add release <tag>", "tag only verified work; observes: what to watch"],
  ["doctor --sync · graph.json · index.md", "nothing — nothing is compiled"],
];

/* ------------------------------------------------ helpers */

const fmt = (n) => n.toLocaleString("en-US");
const EASE = [0.22, 1, 0.36, 1];
const change = (m) => (m.b === 0 ? "removed" : "−" + Math.round((1 - m.b / m.a) * 100) + "%");

function Counter({ from, to, go, reduce }) {
  const [v, setV] = useState(from);
  useEffect(() => {
    if (!go) return;
    if (reduce) { setV(to); return; }
    const c = animate(from, to, { duration: 1.6, ease: EASE, delay: 0.35, onUpdate: (x) => setV(Math.round(x)) });
    return () => c.stop();
  }, [go, reduce]);
  return html`<span>${fmt(v)}</span>`;
}

const fadeUp = (reduce, i = 0) => (reduce ? {} : {
  initial: { opacity: 0, y: 18 },
  whileInView: { opacity: 1, y: 0 },
  viewport: { once: true, amount: 0.2 },
  transition: { duration: 0.55, delay: i * 0.06, ease: EASE },
});

function Seg({ value, onChange, id }) {
  return html`
    <div class="seg" role="group" aria-label="Compare version">
      ${["3.7", "4.0"].map((v) => html`
        <button key=${v} aria-pressed=${value === v} onClick=${() => onChange(v)}>
          ${value === v && html`<${motion.span} layoutId=${"pill-" + id} class="pill" transition=${{ type: "spring", stiffness: 420, damping: 34 }}>
            <span class="edge" style=${{ background: v === "3.7" ? "var(--s37)" : "var(--s40)" }}></span>
          </${motion.span}>`}
          ADD ${v}
        </button>`)}
    </div>`;
}

/* ------------------------------------------------ sections */

function Hero({ reduce }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, amount: 0.3 });
  return html`
    <section class="hero" id="top">
      <div class="wrap">
        <${motion.div} ...${fadeUp(reduce)}>
          <div class="tag"><span class="dot s37"></span>3.7 · last engine release <span style=${{ color: "var(--text-muted)" }}>→</span><span class="dot s40"></span>4.0 · PR #226</div>
          <h1>One skill.<br/>No engine.</h1>
          <p class="lede">ADD 4.0 keeps the method — direction before build, evidence over inspection, a durable bundle — and drops the machinery that enforced it. The model follows one markdown skill with the tools every project already has: files, git, and its own test command.</p>
        </${motion.div}>
        <div class="stats" ref=${ref}>
          ${HERO.map((h, i) => html`
            <${motion.div} key=${h.label} class="card stat" ...${fadeUp(reduce, i + 1)}>
              <div class="label">${h.label}</div>
              <div class="big"><${Counter} from=${h.from} to=${h.to} go=${inView} reduce=${reduce} />${h.unit ? html`<span style=${{ fontSize: "1rem", fontWeight: 600, color: "var(--text-secondary)" }}> ${h.unit}</span>` : null}</div>
              <div class="from">was ${fmt(h.from)}${h.unit ? " " + h.unit : ""} · ${h.note}</div>
            </${motion.div}>`)}
        </div>
      </div>
    </section>`;
}

function Stack({ reduce }) {
  const [ver, setVer] = useState("3.7");
  const [auto, setAuto] = useState(true);
  const ref = useRef(null);
  const inView = useInView(ref, { amount: 0.3 });
  useEffect(() => {
    if (!auto || !inView || reduce) return;
    const t = setInterval(() => setVer((v) => (v === "3.7" ? "4.0" : "3.7")), 4200);
    return () => clearInterval(t);
  }, [auto, inView, reduce]);
  const pick = (v) => { setAuto(false); setVer(v); };
  const calls = CALLS[ver];
  const engineCalls = calls.filter((c) => c[1] === "engine").length;
  const color = ver === "3.7" ? "var(--s37)" : "var(--s40)";
  return html`
    <section id="stack" ref=${ref}>
      <div class="wrap">
        <h2>What sits between the agent and your code</h2>
        <p class="sub">In 3.7 every step went through the engine. In 4.0 that layer is gone — the agent works the bundle and git directly.${auto && !reduce ? " Auto-playing; pick a version to hold it." : ""}</p>
        <${Seg} value=${ver} onChange=${pick} id="stack" />
        <div class="stackgrid">
          <div class="card stack">
            <${LayoutGroup}>
              <${AnimatePresence} initial=${false} mode="popLayout">
                ${STACK[ver].map((l) => html`
                  <${motion.div} key=${l.id + (l.id === "human" || l.id === "agent" || l.id === "bundle" ? ver : "")} layout=${!reduce}
                    initial=${reduce ? false : { opacity: 0, scale: 0.96 }}
                    animate=${{ opacity: 1, scale: 1 }}
                    exit=${reduce ? undefined : { opacity: 0, scale: 0.9, filter: "blur(4px)", transition: { duration: 0.3 } }}
                    transition=${{ type: "spring", stiffness: 300, damping: 30 }}
                    class=${"layer" + (l.engine ? " engine" : "")}
                    style=${l.engine ? { borderColor: "var(--s37)" } : (l.id === "tools" && ver === "4.0" ? { borderColor: "var(--s40)" } : undefined)}>
                    <div class="k">${l.k}</div>
                    <div class="v">${l.v}</div>
                    <div class="d">${l.d}</div>
                  </${motion.div}>`)}
              </${AnimatePresence}>
            </${LayoutGroup}>
          </div>
          <div class="card feed">
            <h3><span>One Task, start to finish</span>
              <span class="count">${calls.length} steps · <strong style=${{ color: "var(--text-primary)" }}>${engineCalls}</strong> engine calls</span></h3>
            <div style=${{ height: 4, borderRadius: 4, background: "var(--surface-2)", overflow: "hidden" }} aria-hidden="true">
              <${motion.div} animate=${{ width: (engineCalls / MAX_ENGINE) * 100 + "%" }} transition=${{ duration: reduce ? 0 : 0.6 }}
                style=${{ height: "100%", background: color, borderRadius: 4 }} />
            </div>
            <${AnimatePresence} mode="wait" initial=${false}>
              <${motion.ul} key=${ver} class="calls"
                initial=${reduce ? false : "hidden"} animate="show" exit=${reduce ? undefined : { opacity: 0, transition: { duration: 0.2 } }}
                variants=${{ hidden: {}, show: { transition: { staggerChildren: 0.05 } } }}>
                ${calls.map(([c, kind], i) => html`
                  <${motion.li} key=${c + i}
                    variants=${{ hidden: { opacity: 0, x: -10 }, show: { opacity: 1, x: 0 } }}
                    style=${kind === "engine" ? { borderColor: "color-mix(in srgb, var(--s37) 55%, transparent)" } : undefined}>
                    <span class="n">${i + 1}</span><code>${c}</code><span class="kind">${kind}</span>
                  </${motion.li}>`)}
              </${motion.ul}>
            </${AnimatePresence}>
            <p class="note">Steps for one standard Task: 3.7 from its command cookbook, 4.0 from SKILL.md. Each engine call was a full agent turn re-reading its context; in the 3.x benchmarks, engine ceremony was a large share of all turns.</p>
          </div>
        </div>
      </div>
    </section>`;
}

function Loop({ reduce }) {
  const [ver, setVer] = useState("4.0");
  const color = ver === "3.7" ? "var(--s37)" : "var(--s40)";
  return html`
    <section id="loop">
      <div class="wrap">
        <h2>The loop is the same — the mechanism is not</h2>
        <p class="sub">Direction → Build → Verify survives intact. Toggle to see how each stage is carried out.</p>
        <${Seg} value=${ver} onChange=${setVer} id="loop" />
        <div class="loop">
          ${STAGES.map((s, i) => html`
            <${motion.div} key=${s.name} class="card stage" ...${fadeUp(reduce, i)}>
              <${motion.span} class="rail" animate=${{ backgroundColor: color }} transition=${{ duration: 0.4 }} />
              <div class="idx">${String(i + 1).padStart(2, "0")} · ${s.name}</div>
              <${AnimatePresence} mode="wait" initial=${false}>
                <${motion.div} key=${ver}
                  initial=${reduce ? false : { opacity: 0, y: 10, filter: "blur(3px)" }}
                  animate=${{ opacity: 1, y: 0, filter: "blur(0px)" }}
                  exit=${reduce ? undefined : { opacity: 0, y: -8, filter: "blur(3px)" }}
                  transition=${{ duration: 0.28, delay: reduce ? 0 : i * 0.04 }}>
                  <div class="chips">${s[ver].chips.map((c) => html`<code key=${c} class="chip">${c}</code>`)}</div>
                  <p>${s[ver].p}</p>
                </${motion.div}>
              </${AnimatePresence}>
            </${motion.div}>`)}
        </div>
      </div>
    </section>`;
}

const Check = () => html`<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M6 10.5l2.6 2.6L14 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const Swap = () => html`<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M6 8h8l-2.5-2.5M14 12H6l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const Cross = () => html`<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M7 7l6 6M13 7l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;

function Values({ reduce }) {
  const list = (items, Icon, removed) => html`
    <${motion.ul} class=${"items" + (removed ? " removed" : "")}
      initial=${reduce ? false : "hidden"} whileInView="show" viewport=${{ once: true, amount: 0.15 }}
      variants=${{ hidden: {}, show: { transition: { staggerChildren: 0.07 } } }}>
      ${items.map(([t, s]) => html`
        <${motion.li} key=${t} variants=${{ hidden: { opacity: 0, y: 10 }, show: { opacity: 1, y: 0 } }}>
          <${Icon} />
          <div>
            <div class="t">${removed
              ? html`<span class="strike">${t}<${motion.span} class="line" aria-hidden="true"
                  variants=${{ hidden: { scaleX: 0 }, show: { scaleX: 1, transition: { delay: 0.35, duration: 0.5 } } }} /></span>`
              : t}</div>
            <div class="s">${s}</div>
          </div>
        </${motion.li}>`)}
    </${motion.ul}>`;
  return html`
    <section id="values">
      <div class="wrap">
        <h2>What ADD keeps, changes and removes</h2>
        <p class="sub">The values are the method; the engine was one way to enforce them. 4.0 keeps every value and changes how each is carried.</p>
        <div class="values">
          <div class="card col"><h3><${Check} /> Kept — the values</h3><p class="blurb">Unchanged in 4.0, now stated as rules the model follows.</p>${list(KEPT, Check, false)}</div>
          <div class="card col"><h3><${Swap} /> Changed — the mechanism</h3><p class="blurb">Same guarantee, carried by files and git instead of verbs.</p>${list(CHANGED, Swap, false)}</div>
          <div class="card col"><h3><${Cross} /> Removed — the machinery</h3><p class="blurb">Gone from every shipped tree; history stays in archive/.</p>${list(REMOVED, Cross, true)}</div>
        </div>
      </div>
    </section>`;
}

function Metrics({ reduce }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, amount: 0.15 });
  const [tip, setTip] = useState(null);
  const [table, setTable] = useState(false);
  const show = (e, m) => {
    const r = e.currentTarget.getBoundingClientRect();
    setTip({ x: Math.min(r.left + 12, window.innerWidth - 220), y: Math.max(8, r.top - 86), m });
  };
  const bar = (m, which, i) => {
    const v = which === "a" ? m.a : m.b;
    const pct = (v / m.a) * 100;
    const label = which === "a" ? "3.7" : "4.0";
    const target = v === 0 ? "0px" : `max(4px, calc(${pct}% - 110px))`;
    return html`
      <div class="barrow" key=${which}>
        <span class="ver">${label}</span>
        <div class="track" tabIndex="0" role="img" aria-label=${`${m.name}, ADD ${label}: ${fmt(v)} ${m.unit}`}
          onMouseEnter=${(e) => show(e, m)} onMouseMove=${(e) => show(e, m)} onMouseLeave=${() => setTip(null)}
          onFocus=${(e) => show(e, m)} onBlur=${() => setTip(null)}>
          <${motion.div} class="fill" style=${{ background: which === "a" ? "var(--s37)" : "var(--s40)" }}
            initial=${{ width: reduce ? target : "0px" }}
            animate=${{ width: inView || reduce ? target : "0px" }}
            transition=${{ duration: reduce ? 0 : 1.1, delay: reduce ? 0 : 0.08 * i + (which === "b" ? 0.25 : 0), ease: EASE }} />
          <span class="val">${fmt(v)} ${m.unit}</span>
        </div>
      </div>`;
  };
  return html`
    <section id="numbers">
      <div class="wrap">
        <h2>By the numbers</h2>
        <p class="sub">Measured from the repository: the 3.7.0 release commit against the 4.0 branch. Each row has its own scale — compare the pair, not across rows.</p>
        <div class="legend">
          <span><span class="dot s37"></span>ADD 3.7</span><span><span class="dot s40"></span>ADD 4.0</span>
          <span class="spacer"></span>
          <button class="ghost" onClick=${() => setTable(!table)} aria-pressed=${table}>${table ? "Show chart" : "Show table"}</button>
        </div>
        <div class="card metrics" ref=${ref}>
          ${table ? html`
            <table class="data"><thead><tr><th>Measure</th><th>ADD 3.7</th><th>ADD 4.0</th><th>Change</th></tr></thead>
              <tbody>${METRICS.map((m) => html`<tr key=${m.name}><td>${m.name}</td><td>${fmt(m.a)} ${m.unit}</td><td>${fmt(m.b)} ${m.unit}</td><td>${change(m)}</td></tr>`)}</tbody></table>`
          : METRICS.map((m, i) => html`
            <div class="metric" key=${m.name}>
              <div><div class="name">${m.name}</div><div class="unit">${change(m)}</div></div>
              <div class="bars">${bar(m, "a", i)}${bar(m, "b", i)}</div>
            </div>`)}
        </div>
        ${tip && html`<div class="tip" style=${{ left: tip.x + "px", top: tip.y + "px" }}>
          <div style=${{ fontWeight: 600 }}>${tip.m.name}</div>
          <div class="row"><span><span class="dot s37"></span>ADD 3.7</span><span>${fmt(tip.m.a)} ${tip.m.unit}</span></div>
          <div class="row"><span><span class="dot s40"></span>ADD 4.0</span><span>${fmt(tip.m.b)} ${tip.m.unit}</span></div>
          <div class="row" style=${{ color: "var(--text-muted)" }}><span>change</span><span>${change(tip.m)}</span></div>
        </div>`}

        <div class="why">
          <${motion.div} class="card" ...${fadeUp(reduce)}>
            <h3>Why the engine went</h3>
            <p style=${{ color: "var(--text-secondary)", margin: "0 0 14px" }}>On the repo's own benchmark (same model, evolving milestones), 3.x ADD matched spec-kit's fidelity at nearly five times the tokens.</p>
            ${[["ADD 3.x (engine)", 18.2, "var(--s37)", "18.2M tokens · ~$15 · fidelity min 0.97"],
               ["spec-kit", 3.8, "var(--neutral-bar)", "3.8M tokens · $2.53 · fidelity min 0.95"]].map(([n, v, c, d], i) => html`
              <div key=${n} style=${{ margin: "10px 0" }}>
                <div style=${{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", fontSize: ".9rem" }}><strong>${n}</strong><span style=${{ color: "var(--text-secondary)", fontVariantNumeric: "tabular-nums" }}>${d}</span></div>
                <div style=${{ height: 14, marginTop: 4 }} role="img" aria-label=${n + ": " + d}>
                  <${motion.div} style=${{ height: 12, background: c, borderRadius: "0 4px 4px 0" }}
                    initial=${{ width: reduce ? (v / 18.2) * 100 + "%" : "0%" }} whileInView=${{ width: (v / 18.2) * 100 + "%" }}
                    viewport=${{ once: true }} transition=${{ duration: reduce ? 0 : 1.1, delay: i * 0.2, ease: EASE }} />
                </div>
              </div>`)}
            <p class="note">Source: benchmark/BENCHMARK.md, final cross-arm comparison. On the amb1 track, vanilla prompting cost $0.61 per run vs ADD 3.x $2.13–2.52 (benchmark/FINDINGS-2026-08-10.md).</p>
          </${motion.div}>
          <${motion.div} class="card" ...${fadeUp(reduce, 1)}>
            <h3>What is not claimed yet</h3>
            <p style=${{ color: "var(--text-secondary)", margin: 0 }}>4.0 has not been benchmarked. The saving is structural — zero engine calls and a 174-line skill instead of ~106 KB of guides — not a measured token figure. Re-running the benchmark arm against 4.0 is the honest next step before claiming a number.</p>
            <p class="note">The cut itself: 717 files changed, +6,107 / −77,438 lines, including the 3.x bundle moved to archive/.</p>
          </${motion.div}>
        </div>
      </div>
    </section>`;
}

function Trade({ reduce }) {
  return html`
    <section id="tradeoff">
      <div class="wrap">
        <h2>What 4.0 gives up — and what replaces it</h2>
        <p class="sub">The one real loss is mechanical refusal. In its place: every claim is checkable by anyone with git.</p>
        <div class="trade">
          <${motion.div} class="card" ...${fadeUp(reduce)}>
            <h3><span class="dot s37"></span>3.7 — the engine refused</h3>
            <p style=${{ color: "var(--text-secondary)", margin: 0 }}>A PASS over a stale receipt, an edited frozen contract, or a report older than its run was refused by code the agent could not talk past.</p>
            <pre class="term">$ add gate session-expiry PASS
refused R:OLDSEAL — the direction changed after freeze
next: add freeze session-expiry</pre>
          </${motion.div}>
          <${motion.div} class="swap" aria-hidden="true"
            initial=${reduce ? false : { rotate: -90, opacity: 0 }} whileInView=${{ rotate: 0, opacity: 1 }} viewport=${{ once: true }}
            transition=${{ type: "spring", stiffness: 200, damping: 16, delay: 0.3 }}>⇄</${motion.div}>
          <${motion.div} class="card" ...${fadeUp(reduce, 2)}>
            <h3><span class="dot s40"></span>4.0 — anyone can check</h3>
            <p style=${{ color: "var(--text-secondary)", margin: 0 }}>A dishonest agent could now write a PASS. But the seal is a diff, the evidence names exact commands at an exact commit, and every change of intent is a commit.</p>
            <pre class="term">$ F=$(git log -1 --format=%H --grep='freeze(session-expiry)')
$ git diff $F HEAD -- .add/tasks/session-expiry.md tests/auth/
                         # prints nothing → the seal held
$ git log --oneline --grep='(session-expiry)'</pre>
          </${motion.div}>
        </div>
      </div>
    </section>`;
}

function Mapping({ reduce }) {
  return html`
    <section id="map">
      <div class="wrap">
        <h2>Every 3.7 mechanism, mapped</h2>
        <p class="sub">From chapter 20 of the book, “What changed in 4.0”.</p>
        <${motion.div} class="card map"
          initial=${reduce ? false : "hidden"} whileInView="show" viewport=${{ once: true, amount: 0.1 }}
          variants=${{ hidden: {}, show: { transition: { staggerChildren: 0.05 } } }}>
          ${MAP.map(([a, b]) => html`
            <${motion.div} key=${a} class="maprow" variants=${{ hidden: { opacity: 0, x: -12 }, show: { opacity: 1, x: 0 } }}>
              <code class="from">${a}</code><span class="to">→</span><code>${b}</code>
            </${motion.div}>`)}
        </${motion.div}>
      </div>
    </section>`;
}

function App() {
  const reduce = useReducedMotion();
  const [theme, setTheme] = useState(null);
  useEffect(() => { if (theme) document.documentElement.dataset.theme = theme; }, [theme]);
  const isDark = theme ? theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  return html`
    <div>
      <div class="topbar"><div class="wrap">
        <span class="brand">ADD 3.7 → 4.0</span>
        <nav><a href="#stack">Stack</a><a href="#loop">Loop</a><a href="#values">Values</a><a href="#numbers">Numbers</a><a href="#tradeoff">Trade-off</a><a href="#map">Mapping</a></nav>
        <span class="spacer"></span>
        <button class="ghost" onClick=${() => setTheme(isDark ? "light" : "dark")}>${isDark ? "Light" : "Dark"}</button>
      </div></div>
      <${Hero} reduce=${reduce} />
      <${Stack} reduce=${reduce} />
      <${Loop} reduce=${reduce} />
      <${Values} reduce=${reduce} />
      <${Metrics} reduce=${reduce} />
      <${Trade} reduce=${reduce} />
      <${Mapping} reduce=${reduce} />
      <footer><div class="wrap">
        <strong>Sources.</strong>
        <ul>
          <li>3.7.0 release: PR #224 (release/3.7.0 · fba54456). 4.0: draft PR #226 (feat/add-4-skill-only · 6a097175).</li>
          <li>Sizes: git ls-tree and wc on both commits. Benchmarks: benchmark/BENCHMARK.md, benchmark/FINDINGS-2026-08-10.md.</li>
          <li>Mechanism mapping: add-method/docs/20-whats-new-in-4.md. The method itself: add-method/skill/add/SKILL.md.</li>
        </ul>
      </div></footer>
    </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
