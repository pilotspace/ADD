# MkDocs site for the AIDD book — built from the canonical book in add-method/docs/.
# The book is the single source of truth (docs_dir below); this file adds no book content.
# Home is the existing README.md (MkDocs maps README.md -> index.html at the site root).
# Build:  pip install -r requirements-docs.txt  &&  mkdocs build --strict
# Serve:  mkdocs serve

site_name: AI-Driven Development (ADD)
site_description: >-
  ADD (AI-Driven Development) — one skill that drives spec-and-tests-first development
  with files, git and your test command, while the human owns direction. The complete book.
site_url: https://pilotspace.github.io/ADD/
repo_url: https://github.com/pilotspace/ADD
repo_name: pilotspace/ADD
copyright: Copyright &copy; Pilotspace — ADD (AI-Driven Development)

# Single source of truth: the canonical book. No content is copied or duplicated.
docs_dir: add-method/docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  # Render ```mermaid fenced blocks as diagrams (Material auto-loads mermaid.js
  # for .mermaid blocks). Enables the native flow diagram in 02-the-flow.md now
  # that the add-flow.png raster is retired.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Explicit, ordered nav, grouped into the book's parts. tests/book/test_book.py holds it to the
# pages on disk: every entry exists, and every page under add-method/docs/ is listed once.
nav:
  - Home: README.md
  - Part I — Foundations:
      - "00 · The shift: why ADD exists": 00-introduction.md
      - "01 · Core principles": 01-principles.md
  - Part II — The loop:
      - "02 · The loop, and what is disposable": 02-the-flow.md
      - "03 · Direction — rules, assumptions, checks, the seal": 03-direction.md
      - "04 · Build — red to green, inside the lines": 04-build.md
      - "05 · Verify — evidence, residue, refute, verdict": 05-verify.md
      - "06 · Learn — lessons, milestones, the report": 06-the-loop.md
  - Part III — Operating the method:
      - "07 · Setup and the four lanes": 07-setup-and-lanes.md
      - "19 · Explore — when the answer is the deliverable": 19-dynamic-workflow.md
      - "08 · Parallel work — worktrees": 08-parallel-work.md
      - "09 · Governance — verdicts, floors, review after": 09-governance.md
      - "10 · Personas — expert lenses": 10-personas.md
      - "11 · Adoption": 11-adoption.md
  - Part IV — Reference:
      - "12 · The .add/ bundle — ABF-1 format": 12-bundle-format.md
      - "13 · Files and commits": 13-files-and-commits.md
      - "14 · The foundation and the five living specs": 14-foundation.md
      - "15 · Foundations and lineage": 15-foundations-and-lineage.md
      - "16 · Releasing": 16-releasing.md
      - "17 · Components — monorepo and multi-repo": 17-components.md
      - "20 · What changed in 4.0 — migrating from 3.x": 20-whats-new-in-4.md
  - Appendices:
      - "Appendix C · Glossary": appendix-c-glossary.md
      - "Appendix D · The worked example, end to end": appendix-d-worked-example.md
      - "Appendix E · Checklists": appendix-e-checklists.md
      - "Appendix G · References & lineage": appendix-g-references.md
      - "Appendix H · ADD vs spec-kit — the honest comparison": appendix-h-add-vs-spec-kit.md
