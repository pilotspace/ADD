# Autonomous release: a version tag builds one candidate, smokes its installed
# wheel and npm tarball (including upgrade from the prior published version),
# then both registries receive those exact checked files.
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# The tag (minus the leading `v`) MUST equal BOTH package.json and pyproject.toml
# versions — the `guard` job fails the release closed if they drift. Only after the
# full test suite, versions, and candidate-byte smoke are green do the two
# publish jobs run. The local report is not registry-served-byte attestation.
#
# ── One-time setup (do this once, then every tag self-publishes) ──────────────
#
# npm  — Trusted Publishing (OIDC) — NO token to store or rotate. On npmjs.com:
#          @pilotspace/add ▸ Settings ▸ Trusted Publisher ▸ GitHub Actions, matching
#          EXACTLY:
#            Organization or user:  pilotspace
#            Repository:            ADD
#            Workflow filename:     publish.yml      (filename only, not the path)
#            Environment name:      (leave blank — the npm job declares none)
#            Allowed actions:       npm publish
#        Once registered, the npm CLI auto-detects the GitHub OIDC environment and
#        authenticates with no secret; provenance is generated automatically because
#        pilotspace/ADD is a public repo (no `--provenance` flag needed). Requires
#        npm >= 11.5.1 — Node 24 + the `npm install -g npm@latest` step below (Node
#        24.0 itself ships npm 11.3, under the floor).
#        ## REGISTER THE TRUSTED PUBLISHER ON npmjs.com BEFORE THE NEXT TAG — there is
#        no token fallback; an unregistered publisher fails the npm job closed.
#        (History: a stored npm access token + `--provenance` published through
#        v1.12.0; migrated to trusted publishing for TODO #23 — ends the token churn.)
#
# PyPI — uses OIDC Trusted Publishing (no token to store/rotate). On PyPI:
#          Account ▸ Publishing ▸ Add a pending publisher (the project pilotspace-add
#          does not exist yet, so use the "pending" form), matching EXACTLY:
#            PyPI Project Name:  pilotspace-add
#            Owner:              pilotspace
#            Repository name:    ADD
#            Workflow name:      publish.yml
#            Environment name:   pypi
#        Token fallback (if you prefer a secret over OIDC): add a PYPI_API_TOKEN
#        secret, drop the `environment:`/`id-token` from the pypi job, and pass
#        `password: ${{ secrets.PYPI_API_TOKEN }}` to the publish action.

name: publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  guard:
    name: Test suite + tag/version match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The suite runs both installer twins (`node bin/cli.js` and the pip package) against the
      # same projects and compares the trees, so node must be on PATH. The npm twin has no
      # dependencies, so there is nothing to `npm ci`.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pytest
        run: python3 -m pip install --upgrade pytest

      # The WHOLE suite, not a hand-picked subset. A release gate that runs part of the suite
      # is not a gate. Mirrors ci.yml.
      - name: Run the test suite (red/green gate)
        working-directory: add-method
        run: python3 -m pytest -q

      - name: Tag must equal package.json AND pyproject.toml versions
        working-directory: add-method
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REF_NAME#v}"
          PKG="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          PY="$(python3 - <<'PYEOF'
          import re, pathlib
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', pathlib.Path("pyproject.toml").read_text())
          print(m.group(1) if m else "")
          PYEOF
          )"
          echo "tag=$TAG  package.json=$PKG  pyproject=$PY"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }
          test "$TAG" = "$PY"  || { echo "::error::tag $TAG != pyproject $PY"; exit 1; }

  candidate:
    name: Build once + install candidate bytes
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build the tagged wheel, sdist and npm tarball once
        working-directory: add-method
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade build packaging
          mkdir -p release-candidate/python release-candidate/npm release-candidate/previous
          python3 -m build --outdir release-candidate/python
          npm pack --pack-destination release-candidate/npm

      - name: Retrieve the preceding published version for an upgrade probe
        working-directory: add-method
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREVIOUS_VERSION="$(python3 -c 'import os,subprocess; from packaging.version import Version; current=Version(os.environ["REF_NAME"][1:]); tags=subprocess.check_output(["git","tag","--list","v*.*.*"],text=True).splitlines(); older=max(((Version(tag[1:]),tag[1:]) for tag in tags if Version(tag[1:]) < current), default=(None,"")); print(older[1])')"
          test -n "$PREVIOUS_VERSION" || { echo '::error::no preceding release tag for upgrade smoke'; exit 1; }
          python3 -m pip download --no-deps --only-binary=:all: "pilotspace-add==${PREVIOUS_VERSION}" --dest release-candidate/previous
          npm pack "@pilotspace/add@${PREVIOUS_VERSION}" --pack-destination release-candidate/previous

      - name: Record expected hashes and install the exact candidate files
        working-directory: add-method
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, json, subprocess
          from pathlib import Path

          root = Path('release-candidate')
          def one(pattern):
              found = list(root.glob(pattern))
              if len(found) != 1:
                  raise SystemExit(f'expected exactly one {pattern}; found {found}')
              path = found[0].resolve()
              return {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}

          manifest = {
              'tag_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tag_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'candidate': {
                  'wheel': one('python/*.whl'),
                  'sdist': one('python/*.tar.gz'),
                  'npm': one('npm/*.tgz'),
              },
              'previous': {
                  'wheel': one('previous/*.whl'),
                  'npm': one('previous/*.tgz'),
              },
              'preserve': {
                  '.add/user-note.md': 'my note survives the upgrade',
                  'AGENTS.md#outside-managed-block': 'my instruction survives the upgrade',
              },
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYEOF
          # The candidate has no runtime dependencies. The PREVIOUS (3.x) tarball declared one, so
          # prime the npm cache from that already hashed local tarball; the gate below then
          # installs both tarballs by path with --offline. Priming itself is not a PASS receipt.
          npm install --ignore-scripts --no-audit --no-fund --no-save release-candidate/previous/*.tgz --prefix "${RUNNER_TEMP}/add-npm-cache-prime-previous"
          python3 scripts/candidate_artifact_smoke.py --manifest release-candidate/manifest.json --report release-candidate/report.json
          sha256sum release-candidate/python/* release-candidate/npm/* > release-candidate/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()     # a refused smoke still attaches report.json for diagnosis
        with:
          name: add-release-candidate
          path: add-method/release-candidate/
          if-no-files-found: error
          retention-days: 30

  npm:
    name: Publish @pilotspace/add to npm
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for OIDC trusted publishing (+ automatic provenance)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'     # trusted publishing needs npm 11.5.1+, which ships with Node 24+
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1; Node 24.0 ships npm 11.3, so bump
      # explicitly rather than depending on the bundled version.
      - name: Ensure npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v8
        with:
          name: add-release-candidate
          path: add-method/release-candidate/

      - name: Rehash the exact candidate before npm publish
        working-directory: add-method
        run: sha256sum -c release-candidate/SHA256SUMS

      - name: Publish if this version is new (idempotent — safe to re-run a tag)
        working-directory: add-method
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          # npm assigns the `latest` dist-tag when none is given — it does NOT infer a channel from
          # a semver prerelease. Bare `npm publish` of 3.0.0-beta.1 would therefore repoint every
          # plain `npm i @pilotspace/add` at the beta. Derive the channel instead of hard-coding it,
          # so the final release still claims `latest` rather than stranding it on the old major.
          # (PyPI needs no counterpart: pip skips prereleases unless asked with `--pre`.)
          case "$VERSION" in
            *-*) DIST_TAG=beta ;;    # any semver prerelease: -beta.N, -rc.N, …
            *)   DIST_TAG=latest ;;
          esac
          if npm view "@pilotspace/add@${VERSION}" version >/dev/null 2>&1; then
            echo "@pilotspace/add@${VERSION} already on the registry — skipping (no deps)."
          else
            echo "publishing ${VERSION} to the '${DIST_TAG}' channel"
            npm publish --access public --tag "$DIST_TAG" "./release-candidate/npm/pilotspace-add-${VERSION}.tgz"
          fi

  pypi:
    name: Publish pilotspace-add to PyPI
    needs: candidate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write          # required for PyPI OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: add-release-candidate
          path: add-method/release-candidate/

      - name: Rehash and stage only the checked Python files
        working-directory: add-method
        run: |
          set -euo pipefail
          sha256sum -c release-candidate/SHA256SUMS
          mkdir -p dist
          cp release-candidate/python/*.whl release-candidate/python/*.tar.gz dist/
          test "$(sha256sum dist/* | cut -d' ' -f1 | sort)" = "$(sha256sum release-candidate/python/* | cut -d' ' -f1 | sort)"

      - name: Publish via OIDC (no API token stored; idempotent re-runs)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: add-method/dist
          skip-existing: true
